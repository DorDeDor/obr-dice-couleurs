name: Build et déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: overlay
      - name: Récupérer le Dice officiel (version figée)
        run: |
          git clone https://github.com/owlbear-rodeo/dice.git upstream
          cd upstream
          git checkout ccc32beceee0888c0a48129fbb23f4a636c710ee
          git apply --recount --ignore-whitespace ../overlay/dice-couleurs.patch ../overlay/02-fix-lancer-des-colores.patch
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        working-directory: upstream
        run: |
          yarn install --frozen-lockfile
          yarn build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: upstream/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
